# Tool pins. Tasks live in .mise/tasks/ (run `mise tasks` to list them).
[tools]
# Standard edition: the theme is plain CSS, so Hugo extended (Sass) is not
# needed. Keep in step with [module.hugoVersion] in hugo.toml.
hugo = "0.166.0"
# rumdl is a Rust port of markdownlint: same rule set, one binary, no node.
rumdl = "0.3.4"
taplo = "0.10.0"
lychee = "0.24.2"
shellcheck = "0.11.0"
# Repository tooling: actionlint checks the workflows, gh cuts releases and
# syncs labels, jq reads .github/labels.json.
actionlint = "1.7.12"
gh = "2.104.0"
jq = "1.8.2"

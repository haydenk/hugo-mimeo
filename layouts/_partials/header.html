{{- /* The site title is the home page's <h1>; every other page has its own. */}}
{{- if .IsHome }}
<h1 class="site-title"><a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a></h1>
{{- else }}
<p class="site-title"><a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a></p>
{{- end }}
{{- with site.Menus.main }}
<nav aria-label="Main">
<ul class="menu">
{{- range . }}
<li><a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ else if $.HasMenuCurrent "main" . }} aria-current="true"{{ end }}>{{ .Name }}</a></li>
{{- end }}
</ul>
</nav>
{{- end }}
